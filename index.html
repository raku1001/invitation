@media(max-width:767px){.intro-title-frame{height:auto;aspect-ratio:660/180;min-height:108px;}.intro-copy .intro-title-frame h1{font-size:clamp(30px,7.7vw,52px);padding-bottom:4px;letter-spacing:.08em;}}

/* Anchor mirrored side flourishes to the title, with equal visible spacing. */
.intro-copy{top:0;}
.intro-copy .intro-title-frame h1{padding-left:.12em;font-feature-settings:"halt" 1;}
.intro-title-frame h1::before,.intro-title-frame h1::after{content:"";position:absolute;top:calc(50% + 14px);width:clamp(38px,10vw,118px);height:40px;background:none center/100% 100% no-repeat;pointer-events:none;}
.intro-title-frame h1::before{right:calc(100% + 12px);}
.intro-title-frame h1::after{left:calc(100% + 12px);transform:scaleX(-1);}
@media(max-width:767px){.intro-copy{top:0;}.intro-copy .intro-title-frame h1{padding-left:.08em;}.intro-title-frame h1::before{right:calc(100% + 8px);}.intro-title-frame h1::after{left:calc(100% + 8px);}.intro-title-frame h1::before,.intro-title-frame h1::after{top:calc(50% + 3px);height:28px;}}

.intro-title-frame h1::before,.intro-title-frame h1::after{display:none;}
.intro-copy{top:-24px;}
@media(max-width:767px){.intro-copy{top:-16px;}}

.paper-wrap{padding-bottom:125px;}
@media(max-width:767px){.paper-wrap{padding-bottom:120px;}}

.language-toggle{margin-left:auto;font-size:13px;letter-spacing:.04em;color:var(--ink);}
.language-toggle:disabled{opacity:.55;}
html[lang="en"] .intro-copy .intro-title-frame h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:.045em;}
html[lang="en"] .wordmark{font-size:14px;letter-spacing:.04em;}
html[lang="en"] .rsvp-topline h2{line-height:1.65;}
@media(max-width:767px){.language-toggle{font-size:12px;white-space:nowrap;}html[lang="en"] .wordmark{font-size:12px;}html[lang="en"] .rsvp-actions #attending,html[lang="en"] .rsvp-actions #pending{font-size:13px;line-height:18px;padding:10px 12px;}html[lang="en"] .rsvp-topline{align-items:flex-start;}html[lang="en"] .rsvp-topline>span{padding-top:5px;}}

.celebration-message{position:absolute;z-index:6;left:18px;bottom:14px;max-width:calc(100% - 230px);margin:0;color:var(--ink);font-size:16px;line-height:1.65;letter-spacing:.04em;pointer-events:none;}
@media(max-width:767px){.celebration-message{left:6px;bottom:12px;max-width:calc(100% - 195px);font-size:14px;letter-spacing:0;}}


html[lang="en"] body{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;}
html[lang="en"] .intro-copy .intro-title-frame h1,html[lang="en"] .language-toggle,html[lang="en"] .rsvp-actions #attending,html[lang="en"] .rsvp-actions #pending{font-weight:700;}

/* A final line from the raccoon, after it has landed and caught its breath. */
.celebration-message{left:auto;right:218px;bottom:34px;width:max-content;max-width:calc(100% - 248px);padding:11px 16px;border:1px solid #806044;border-radius:14px;background:#fff9ee;box-shadow:0 4px 12px #4b2c2010;font-size:16px;line-height:1.5;letter-spacing:0;text-align:center;}
.celebration-message::after{content:"";position:absolute;width:11px;height:11px;right:-6px;top:calc(50% - 6px);background:#fff9ee;border-top:1px solid #806044;border-right:1px solid #806044;transform:rotate(45deg);}
@media(max-width:767px){body[data-scene^="celebrate."] .paper-wrap{padding-bottom:240px;}.celebration-message{left:auto;right:12px;bottom:170px;max-width:calc(100% - 28px);padding:10px 14px;font-size:15px;}.celebration-message::after{top:auto;right:75px;bottom:-6px;border-top:0;border-right:1px solid #806044;border-bottom:1px solid #806044;}}

/* English serif text needs a larger size to match Chinese UI readability. */
html[lang="en"] .rsvp-topline h2{font-size:19px;font-weight:700;line-height:1.55;letter-spacing:.015em;}
html[lang="en"] .rsvp-actions #attending,html[lang="en"] .rsvp-actions #pending{font-size:20px;font-weight:700;line-height:1.3;letter-spacing:.02em;}
html[lang="en"] .letter-footer{font-size:16px;font-weight:700;line-height:1.5;letter-spacing:.015em;}
@media(max-width:767px){html[lang="en"] .rsvp-topline h2{font-size:18px;}html[lang="en"] .rsvp-actions #attending,html[lang="en"] .rsvp-actions #pending{font-size:18px;}html[lang="en"] .letter-footer{font-size:15px;}}
@media(max-width:767px){html[lang="en"] .rsvp-actions #attending,html[lang="en"] .rsvp-actions #pending{height:72px;min-height:72px;}}
/* Clear vector lettering, without treating the invitation as a button. */
#paper>.invitation-vector{display:none!important;width:100%;height:auto;}
#paper.vector-ready>.invitation-vector{display:block!important;}
#paper.vector-ready>.invitation-art{display:none!important;}
#paper,#paper *,#extract-paper,#extract-paper *,#flying-letter,#flying-letter *{-webkit-touch-callout:none;-webkit-user-drag:none;-webkit-user-select:none;user-select:none;}</style>
